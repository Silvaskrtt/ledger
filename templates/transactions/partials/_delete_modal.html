{% load i18n %}

<div id="deleteModal" class="modal-overlay" style="display: none;">
    <div class="modal-container fade-up">
        <div class="modal-icon warning">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h3>{% trans "Excluir Transação" %}</h3>
        <p>{% trans "Tem certeza que deseja excluir esta transação?" %}<br>
           {% trans "Esta ação não pode ser desfeita." %}</p>
        <div class="modal-buttons">
            <button class="btn-modal-cancel" onclick="closeDeleteModal()">
                {% trans "Cancelar" %}
            </button>
            <button class="btn-modal-danger" id="confirmDeleteBtn">
                {% trans "Excluir" %}
            </button>
        </div>
    </div>
</div>
