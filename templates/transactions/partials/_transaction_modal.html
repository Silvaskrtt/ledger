{% load i18n %}

<div id="transactionModal" class="modal-overlay" style="display: none;">
    <div class="modal-container modal-large fade-up">
        <div class="modal-header">
            <div class="header-icon">
                <i class="fas fa-exchange-alt"></i>
            </div>
            <h3 id="transactionModalTitle">{% trans "Nova Transação" %}</h3>
            <button class="modal-close" onclick="window.closeTransactionModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="transactionForm" class="modal-form">
            {% csrf_token %}
            
            <!-- Tipo de Transação -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-tag"></i>
                    <span>{% trans "Tipo" %}</span>
                </label>
                <div class="type-buttons">
                    <button type="button" class="type-btn expense active" data-type="expense">
                        <i class="fas fa-arrow-up"></i>
                        <span>{% trans "Despesa" %}</span>
                    </button>
                    <button type="button" class="type-btn income" data-type="income">
                        <i class="fas fa-arrow-down"></i>
                        <span>{% trans "Receita" %}</span>
                    </button>
                </div>
                <input type="hidden" id="transaction_type" name="transaction_type" value="expense">
            </div>
            
            <!-- Descrição -->
            <div class="form-group">
                <label class="form-label" for="description">
                    <i class="fas fa-pencil-alt"></i>
                    <span>{% trans "Descrição" %}</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" id="description" name="description" required 
                           placeholder="{% trans 'Ex: Supermercado, Salário, Netflix...' %}"
                           class="form-input">
                </div>
            </div>
            
            <!-- Valor e Data -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="amount">
                        <i class="fas fa-dollar-sign"></i>
                        <span>{% trans "Valor" %}</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="amount" name="amount" required 
                               placeholder="R$ 0,00"
                               class="form-input">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="date">
                        <i class="fas fa-calendar-alt"></i>
                        <span>{% trans "Data" %}</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="date" id="date" name="date" required class="form-input">
                    </div>
                </div>
            </div>
            
            <!-- Categoria -->
            <div class="form-group">
                <label class="form-label" for="category">
                    <i class="fas fa-folder"></i>
                    <span>{% trans "Categoria" %}</span>
                </label>
                <div class="category-select-wrapper">
                    <select id="category" name="category" required class="form-select">
                        <option value="">{% trans "Selecione uma categoria" %}</option>
                        <option value="Alimentação">🍔 {% trans "Alimentação" %}</option>
                        <option value="Transporte">🚗 {% trans "Transporte" %}</option>
                        <option value="Lazer">🎮 {% trans "Lazer" %}</option>
                        <option value="Moradia">🏠 {% trans "Moradia" %}</option>
                        <option value="Trabalho">💼 {% trans "Trabalho" %}</option>
                        <option value="Educação">📚 {% trans "Educação" %}</option>
                        <option value="Saúde">💊 {% trans "Saúde" %}</option>
                        <option value="Compras">🛒 {% trans "Compras" %}</option>
                    </select>
                    <button type="button" class="btn-add-category" onclick="window.openCategoryModal()" title="{% trans 'Adicionar categoria' %}">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
            
            <!-- Observações -->
            <div class="form-group">
                <label class="form-label" for="notes">
                    <i class="fas fa-sticky-note"></i>
                    <span>{% trans "Observações" %}</span>
                </label>
                <textarea id="notes" name="notes" rows="3" 
                          placeholder="{% trans 'Informações adicionais (opcional)...' %}"
                          class="form-textarea"></textarea>
            </div>
            
            <!-- ID da transação (para edição) -->
            <input type="hidden" id="transaction_id" name="transaction_id" value="">
            
            <!-- Botões -->
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="window.closeTransactionModal()">
                    <i class="fas fa-times"></i>
                    <span>{% trans "Cancelar" %}</span>
                </button>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i>
                    <span id="submitBtnText">{% trans "Salvar" %}</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Category Modal (filho) -->
<div id="categoryModal" class="modal-overlay" style="display: none;">
    <div class="modal-container fade-up">
        <div class="modal-header">
            <div class="header-icon">
                <i class="fas fa-tag"></i>
            </div>
            <h3>{% trans "Nova Categoria" %}</h3>
            <button class="modal-close" onclick="window.closeCategoryModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="categoryForm" class="modal-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="cat_name">
                    <i class="fas fa-font"></i>
                    <span>{% trans "Nome da Categoria" %}</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" id="cat_name" name="name" required 
                           placeholder="{% trans 'Ex: Restaurante, Academia...' %}"
                           class="form-input">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="cat_icon">
                    <i class="fas fa-smile"></i>
                    <span>{% trans "Ícone (emoji)" %}</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" id="cat_icon" name="icon" 
                           placeholder="🍕" maxlength="2"
                           class="form-input">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="cat_color">
                    <i class="fas fa-palette"></i>
                    <span>{% trans "Cor" %}</span>
                </label>
                <div class="color-input-wrapper">
                    <input type="color" id="cat_color" name="color" value="#8A4FFF" class="form-color">
                    <span class="color-preview" id="colorPreview"></span>
                </div>
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="window.closeCategoryModal()">
                    <i class="fas fa-times"></i>
                    <span>{% trans "Cancelar" %}</span>
                </button>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i>
                    <span>{% trans "Adicionar" %}</span>
                </button>
            </div>
        </form>
    </div>
</div>
