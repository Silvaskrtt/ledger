{% load i18n %}

<div class="form-group">
    <label for="{{ field.id_for_label }}">
        <i class="{{ icon }}"></i> {% trans label %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <small class="help-text">{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <div class="field-error">
            {% for error in field.errors %}
                {{ error }}
            {% endfor %}
        </div>
    {% endif %}
</div>
