{% load i18n %}

<div class="form-actions">
    <button type="submit" class="btn-submit">
        <i class="fas fa-save"></i> 
        {% if transaction %}
            {% trans "Salvar Alterações" %}
        {% else %}
            {% trans "Criar Transação" %}
        {% endif %}
    </button>
    
    <a href="#" class="btn-cancel">
        <i class="fas fa-times"></i> {% trans "Cancelar" %}
    </a>
    
    {% if transaction %}
        <button type="button" class="btn-delete" onclick="confirmDelete('{{ transaction.id }}')">
            <i class="fas fa-trash-alt"></i> {% trans "Excluir" %}
        </button>
    {% endif %}
</div>
