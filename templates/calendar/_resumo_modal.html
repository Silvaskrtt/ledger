<div id="resumoModal" class="drawer-backdrop" hidden>
  <div class="drawer glass">
    <div class="drawer-head">
      <div class="drawer-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <h3>Resumo do Dia <span id="resumoDayLabel">-</span></h3>
      <button id="closeResumo" class="close-btn" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <!-- Stats -->
      <div class="resumo-stats">
        <div class="resumo-stat">
          <label>Total Mensal</label>
          <p id="resumoTotalMensal">R$ 0,00</p>
        </div>
        <div class="resumo-stat">
          <label>Divisor (dias)</label>
          <input id="resumoDivisor" type="number" min="1" />
        </div>
        <div class="resumo-stat">
          <label>Total Diário</label>
          <p id="resumoTotalDiario">R$ 0,00</p>
        </div>
      </div>

      <hr class="resumo-divider" />

      <!-- Categorias -->
      <div id="resumoCategories" class="resumo-categories">
        <div class="field">
          <label>Comida</label>
          <input type="number" step="0.01" class="resumo-input" name="comida" placeholder="0,00" />
        </div>
        <div class="field">
          <label>Transporte</label>
          <input type="number" step="0.01" class="resumo-input" name="transporte" placeholder="0,00" />
        </div>
        <div class="field">
          <label>Lazer</label>
          <input type="number" step="0.01" class="resumo-input" name="lazer" placeholder="0,00" />
        </div>
        <div class="field">
          <label>Compras</label>
          <input type="number" step="0.01" class="resumo-input" name="compras" placeholder="0,00" />
        </div>
        <div class="field">
          <label>Saúde</label>
          <input type="number" step="0.01" class="resumo-input" name="saude" placeholder="0,00" />
        </div>
        <div class="field">
          <label>Educação</label>
          <input type="number" step="0.01" class="resumo-input" name="educacao" placeholder="0,00" />
        </div>
      </div>

      <!-- Despesas adicionais -->
      <div class="resumo-extra-wrap">
        <h4>Despesas adicionais</h4>
        <div id="extraExpenses"></div>
        <button id="addExtraExpense" type="button" class="ghost-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar despesa
        </button>
      </div>

      <!-- Actions -->
      <div class="drawer-actions">
        <button id="cancelResumo" type="button" class="ghost-btn wide">Cancelar</button>
        <button id="saveResumo" type="button" class="btn-primary wide">Salvar</button>
      </div>
    </div>
  </div>
</div>
