<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboards - Ledger</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/core/_variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/_reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/dashboard-controls.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/dashboard-widget.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/summary-card.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/chart-container.css' %}">
    <link rel="stylesheet" href="{% static 'css/layouts/dashboard-layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/dashboard.css' %}">
</head>

<body class="dashboard-page">
    <div class="dashboard-container">
        <div class="dashboard-grid">
            
            <!-- Dashboard: Gastos por Cartão -->
            <div class="dashboard-widget">
                <div class="dashboard-widget-header">
                    <h3 class="dashboard-widget-title">💳 Gastos por Cartão</h3>
                </div>
                
                <div class="dashboard-controls">
                    <div class="dashboard-control-group">
                        <label class="dashboard-control-label" for="card-start-date">Data Inicial</label>
                        <input type="date" id="card-start-date" class="dashboard-input">
                    </div>
                    <div class="dashboard-control-group">
                        <label class="dashboard-control-label" for="card-end-date">Data Final</label>
                        <input type="date" id="card-end-date" class="dashboard-input">
                    </div>
                    <div class="dashboard-control-actions">
                        <button class="btn-control" onclick="loadCardExpenses()">Carregar</button>
                    </div>
                </div>

                <div id="card-total" class="dashboard-total" style="display: none;">
                    <span class="dashboard-total-label">Total Gasto</span>
                    <span class="dashboard-total-value" id="card-total-value">R$ 0,00</span>
                </div>

                <div class="dashboard-widget-content">
                    <div id="card-loading" class="chart-loading">
                        <div class="chart-loading-spinner"></div>
                        <span class="chart-loading-text">Carregando...</span>
                    </div>
                    <div id="card-error" class="chart-error" style="display: none;"></div>
                    <div class="chart-container">
                        <canvas id="cardChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Dashboard: Gastos por Categoria -->
            <div class="dashboard-widget">
                <div class="dashboard-widget-header">
                    <h3 class="dashboard-widget-title">📊 Gastos por Categoria</h3>
                </div>
                
                <div class="dashboard-controls">
                    <div class="dashboard-control-group">
                        <label class="dashboard-control-label" for="category-start-date">Data Inicial</label>
                        <input type="date" id="category-start-date" class="dashboard-input">
                    </div>
                    <div class="dashboard-control-group">
                        <label class="dashboard-control-label" for="category-end-date">Data Final</label>
                        <input type="date" id="category-end-date" class="dashboard-input">
                    </div>
                    <div class="toggle-wrapper">
                        <label class="dashboard-control-label">Incluir Pendentes</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="category-include-pending">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="dashboard-control-actions">
                        <button class="btn-control" onclick="loadCategoryExpenses()">Carregar</button>
                    </div>
                </div>

                <div id="category-total" class="dashboard-total" style="display: none;">
                    <span class="dashboard-total-label">Total Gasto</span>
                    <span class="dashboard-total-value" id="category-total-value">R$ 0,00</span>
                </div>

                <div class="dashboard-widget-content">
                    <div id="category-loading" class="chart-loading">
                        <div class="chart-loading-spinner"></div>
                        <span class="chart-loading-text">Carregando...</span>
                    </div>
                    <div id="category-error" class="chart-error" style="display: none;"></div>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Dashboard: Fluxo de Caixa -->
            <div class="dashboard-widget full-width">
                <div class="dashboard-widget-header">
                    <h3 class="dashboard-widget-title">📈 Fluxo de Caixa</h3>
                </div>
                
                <div class="dashboard-controls">
                    <div class="dashboard-control-group">
                        <label class="dashboard-control-label" for="cash-flow-year">Ano:</label>
                        <input type="number" id="cash-flow-year" min="2020" step="1" class="dashboard-input" style="width: 120px;">
                    </div>
                    <div class="dashboard-control-actions">
                        <button class="btn-control" onclick="loadCashFlow()">Carregar</button>
                    </div>
                </div>

                <div class="dashboard-widget-content">
                    <div id="cash-flow-loading" class="chart-loading">
                        <div class="chart-loading-spinner"></div>
                        <span class="chart-loading-text">Carregando...</span>
                    </div>
                    <div id="cash-flow-error" class="chart-error" style="display: none;"></div>
                    <div class="chart-container chart-container--lg">
                        <canvas id="cashFlowChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="{% static 'js/dashboards.js' %}"></script>

    <script>
        // Definir datas padrão (últimos 30 dias)
        const today = new Date();
        const thirtyDaysAgo = new Date(today.getTime() - (30 * 24 * 60 * 60 * 1000));
        
        document.getElementById('card-start-date').valueAsDate = thirtyDaysAgo;
        document.getElementById('card-end-date').valueAsDate = today;
        document.getElementById('category-start-date').valueAsDate = thirtyDaysAgo;
        document.getElementById('category-end-date').valueAsDate = today;
        document.getElementById('cash-flow-year').value = today.getFullYear();

        // Carregar dados ao iniciar
        loadCardExpenses();
        loadCategoryExpenses();
        loadCashFlow();
    </script>
</body>
</html>
