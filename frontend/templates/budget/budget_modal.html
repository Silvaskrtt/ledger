<!-- frontend/templates/budget/budget_modal.html -->

<div class="modal-overlay" id="budgetModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">
                🎯 Nova Meta de Orçamento
            </h3>
            <button type="button" class="close-modal" id="closeBudgetModal" aria-label="Fechar">
                &times;
            </button>
        </div>
        
        <form id="budgetForm" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="category" class="form-label">Categoria *</label>
                <select name="category" id="category" required class="form-control tom-select" 
                        data-placeholder="Selecione uma categoria">
                    <option value="">Selecione uma categoria</option>
                    {% for category in categories %}
                    <option value="{{ category.category }}">
                        {{ category.name }} ({{ category.get_type_display }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="limit_amount" class="form-label">Valor da Meta (R$) *</label>
                <input type="number" 
                       name="limit_amount" 
                       id="limit_amount" 
                       class="form-control"
                       step="0.01" 
                       min="0.01" 
                       placeholder="Ex: 1000.00" 
                       required>
                <small class="form-hint">Valor máximo para gastos nesta categoria</small>
            </div>
            
            <div class="form-group">
                <label for="month" class="form-label">Mês</label>
                <input type="month" 
                       name="month" 
                       id="month" 
                       class="form-control"
                       value="{{ current_year }}-{{ current_month_num|stringformat:'02d' }}"
                       min="{{ current_year }}-01"
                       max="{{ current_year|add:'1' }}-12">
                <small class="form-hint">Deixe em branco para orçamento mensal recorrente</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <span class="btn-text">Salvar Meta</span>
                </button>
                <button type="button" id="cancelBudgetModal" class="btn-secondary">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
