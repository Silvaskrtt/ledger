<!-- frontend/templates/sidebar/sidebar.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo-details">
            <div class="logo_name">Ledger System Finance</div>
            <i class='bx bx-menu' id="btn"></i>
        </div>
        <ul class="nav-list">
            <li>
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Search...">
                <span class="tooltip">Search</span>
            </li>
            <li>
                <a href="/home/">
                    <i class='bx bx-grid-alt'></i>
                    <span class="links_name">Página Principal</span>
                </a>
                <span class="tooltip">Página Principal</span>
            </li>
            <li>
                <a href="/transactions/new/">
                    <i class="fa-solid fa-circle-plus"></i>
                    <span class="links_name">Nova Transação</span>
                </a>
                <span class="tooltip">Nova Transação</span>
            </li>
            <li>
                <a href="/transactions/list/">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span class="links_name">Histórico de Transação</span>
                </a>
                <span class="tooltip">Histórico de Transação</span>
            </li>
            <li>
                <a href="">
                    <i class="fa-solid fa-wallet"></i>
                    <span class="links_name">Orçamento Mensal</span>
                </a>
                <span class="tooltip">Orçamento Mensal</span>
            </li>
            <li>
                <a href="">
                    <i class="fa-solid fa-flag"></i>
                    <span class="links_name">Metas Financeiras</span>
                </a>
                <span class="tooltip">Metas Financeiras</span>
            </li>
            <li class="profile">
                <div class="profile-details">
                    <img src="./images/profile.png" alt="profileImg">
                    <div class="name_job">
                        <div class="name">Murilo</div>
                        <div class="job">Web Developer</div>
                    </div>
                </div>
                <i class='bx bx-log-out' id="log_out"></i>
            </li>
        </ul>
    </div>
</body>

</html>
