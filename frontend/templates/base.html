<!-- frontend/templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ledger{% endblock %}</title>
    
    <!-- Boxicons CSS -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Estilos globais -->
    <link rel="stylesheet" href="{% static 'css/sidebar/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    
    <!-- TomSelect CSS (biblioteca de selects melhorados) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css">
    
    <!-- TomSelect Custom CSS (correções de visualização) -->
    <link rel="stylesheet" href="{% static 'css/tom-select-custom.css' %}">
    
    <!-- Bloco para estilos específicos das páginas -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- CSRF Token (CRÍTICO para logout funcionar) -->
    {% csrf_token %}
    
    <div id="balance-sync-alert" style="display: none;">
        <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Inconsistência detectada nos saldos.</span>
            <button onclick="BalanceValidator.syncAllBalances()" 
                    class="btn btn-sm btn-outline-warning ml-2">
                <i class="fas fa-sync"></i> Sincronizar
            </button>
        </div>
    </div>

    <!-- Layout com sidebar e conteúdo -->
    <div class="app-container">
        {% include 'sidebar/sidebar.html' %}
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <!-- Script do sidebar -->
    <script src="{% static 'js/sidebar.js' %}"></script>
    
    <!-- Scripts globais -->
    <script src="{% static 'js/global.js' %}"></script>
    
    <!-- TomSelect JS (biblioteca de selects melhorados) -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    
    <!-- TomSelectManager - Gerenciador global de instâncias TomSelect -->
    <script src="{% static 'js/tom-select-manager.js' %}"></script>

    <script>
    // Adicionar ao BalanceValidator
    BalanceValidator.showSyncAlert = function(message) {
        const alertDiv = document.getElementById('balance-sync-alert');
        if (alertDiv) {
            const span = alertDiv.querySelector('span');
            if (span) span.textContent = message;
            alertDiv.style.display = 'block';
            
            // Auto-esconder após 30 segundos
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 30000);
        }
    };
    </script>
    
    <!-- Bloco para scripts específicos das páginas -->
    {% block extra_js %}{% endblock %}
</body>
</html>
